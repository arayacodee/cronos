<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">

    <h1 id="login-title">Ingresa a Cronos</h1>

    <p class="login-description">
      Continúa con Google para comenzar a reservar.
    </p>

    <div class="google-section">
      <p class="google-label">Continúa con tu cuenta Google</p>
      <div
        id="google-signin-button"
        role="group"
        aria-label="Autenticación con Google"
      ></div>
    </div>

    @if (loading()) {
      <p class="loading" role="status" aria-live="polite">
        Verificando tu cuenta e iniciando sesión...
      </p>
    }

    @if (errorMessage()) {
      <p class="error" role="alert">
        {{ errorMessage() }}
      </p>
    }

    <p class="account-note">
      El acceso profesional está disponible para cuentas habilitadas por Cronos.
    </p>
  </section>
</main>
